<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Bandwidth Monitor - Real-time Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .connection-panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #dc3545;
            animation: pulse 2s infinite;
        }

        .status-indicator.connected {
            background: #28a745;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .device-table {
            width: 100%;
            border-collapse: collapse;
        }

        .device-table th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #555;
            font-size: 13px;
        }

        .device-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .device-table tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-badge.active {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.blocked {
            background: #f8d7da;
            color: #721c24;
        }

        .status-badge.throttled {
            background: #fff3cd;
            color: #856404;
        }

        .log-container {
            max-height: 400px;
            overflow-y: auto;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
        }

        .log-entry {
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
        }

        .log-entry.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .log-entry.success {
            background: #d4edda;
            color: #155724;
        }

        .log-entry.warning {
            background: #fff3cd;
            color: #856404;
        }

        .log-entry.error {
            background: #f8d7da;
            color: #721c24;
        }

        .timestamp {
            color: #666;
            font-size: 11px;
            margin-right: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌐 Smart Bandwidth Monitor</h1>
            <p class="subtitle">Real-time device monitoring with WebSocket connectivity</p>
        </div>

        <div class="connection-panel">
            <div class="connection-status">
                <div class="status-indicator" id="statusIndicator"></div>
                <span id="connectionStatus">Disconnected</span>
            </div>
            <button class="btn btn-primary" id="connectBtn" onclick="connectWebSocket()">Connect</button>
            <button class="btn btn-danger" id="disconnectBtn" onclick="disconnectWebSocket()" disabled>Disconnect</button>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h2>📱 Connected Devices</h2>
                <div id="deviceList">
                    <div class="empty-state">
                        <p>Connect to WebSocket to view devices</p>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>📊 Live Activity Log</h2>
                <div class="log-container" id="logContainer">
                    <div class="empty-state">
                        <p>Waiting for events...</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>📈 Bandwidth Statistics</h2>
            <div class="stats-grid" id="statsGrid">
                <div class="stat-box">
                    <div class="stat-value" id="totalDevices">0</div>
                    <div class="stat-label">Total Devices</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="activeDevices">0</div>
                    <div class="stat-label">Active Devices</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="blockedDevices">0</div>
                    <div class="stat-label">Blocked Devices</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="throttledDevices">0</div>
                    <div class="stat-label">Throttled Devices</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let reconnectInterval = null;

        function connectWebSocket() {
            const wsUrl = 'ws://localhost:8000/ws/monitor';
            addLog('info', `Connecting to ${wsUrl}...`);

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                addLog('success', 'WebSocket connected successfully');
                updateConnectionStatus(true);
                
                // Request initial device list
                ws.send(JSON.stringify({ type: 'get_devices' }));

                // Start ping interval
                clearInterval(reconnectInterval);
                reconnectInterval = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'ping' }));
                    }
                }, 30000);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleWebSocketMessage(data);
                } catch (error) {
                    addLog('error', `Failed to parse message: ${error.message}`);
                }
            };

            ws.onerror = (error) => {
                addLog('error', `WebSocket error: ${error}`);
            };

            ws.onclose = () => {
                addLog('warning', 'WebSocket connection closed');
                updateConnectionStatus(false);
                clearInterval(reconnectInterval);
            };
        }

        function disconnectWebSocket() {
            if (ws) {
                ws.close();
                ws = null;
                addLog('info', 'Disconnected from WebSocket');
            }
        }

        function handleWebSocketMessage(data) {
            const { type, data: payload, timestamp } = data;

            switch (type) {
                case 'pong':
                    addLog('info', 'Received pong from server');
                    break;

                case 'device_list':
                    addLog('success', `Received device list: ${payload.devices.length} devices`);
                    renderDeviceList(payload.devices);
                    updateStats(payload.devices);
                    break;

                case 'device_update':
                case 'device_blocked':
                case 'device_unblocked':
                case 'device_throttled':
                case 'device_unthrottled':
                    addLog('warning', `Device update: ${type} - ${payload.device.ip_address}`);
                    // Request fresh device list
                    ws.send(JSON.stringify({ type: 'get_devices' }));
                    break;

                case 'bandwidth_stats':
                    addLog('info', `Bandwidth stats: ${payload.total_devices} devices`);
                    break;

                default:
                    addLog('info', `Received: ${type}`);
            }
        }

        function renderDeviceList(devices) {
            const deviceList = document.getElementById('deviceList');

            if (devices.length === 0) {
                deviceList.innerHTML = '<div class="empty-state"><p>No devices found</p></div>';
                return;
            }

            const table = `
                <table class="device-table">
                    <thead>
                        <tr>
                            <th>IP Address</th>
                            <th>Device Name</th>
                            <th>Status</th>
                            <th>Total Sent</th>
                            <th>Total Received</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${devices.map(device => `
                            <tr>
                                <td>${device.ip_address}</td>
                                <td>${device.device_name || 'Unknown'}</td>
                                <td>
                                    <span class="status-badge ${device.status}">
                                        ${device.status.toUpperCase()}
                                    </span>
                                </td>
                                <td>${formatBytes(device.total_bytes_sent)}</td>
                                <td>${formatBytes(device.total_bytes_received)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            deviceList.innerHTML = table;
        }

        function updateStats(devices) {
            document.getElementById('totalDevices').textContent = devices.length;
            document.getElementById('activeDevices').textContent = 
                devices.filter(d => d.status === 'active').length;
            document.getElementById('blockedDevices').textContent = 
                devices.filter(d => d.status === 'blocked').length;
            document.getElementById('throttledDevices').textContent = 
                devices.filter(d => d.status === 'throttled').length;
        }

        function addLog(type, message) {
            const logContainer = document.getElementById('logContainer');
            
            // Remove empty state
            if (logContainer.querySelector('.empty-state')) {
                logContainer.innerHTML = '';
            }

            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.innerHTML = `<span class="timestamp">[${timestamp}]</span>${message}`;
            
            logContainer.insertBefore(logEntry, logContainer.firstChild);

            // Keep only last 50 logs
            while (logContainer.children.length > 50) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }

        function updateConnectionStatus(connected) {
            const indicator = document.getElementById('statusIndicator');
            const status = document.getElementById('connectionStatus');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');

            if (connected) {
                indicator.classList.add('connected');
                status.textContent = 'Connected';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
            } else {
                indicator.classList.remove('connected');
                status.textContent = 'Disconnected';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            }
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Auto-connect on page load (optional - comment out if not desired)
        // window.addEventListener('load', connectWebSocket);
    </script>
</body>
</html>
