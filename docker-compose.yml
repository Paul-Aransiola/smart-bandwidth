services:
  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: bandwidth-monitor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - bandwidth-monitor-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Main API service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bandwidth-monitor-api
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - db-data:/app
      - ./src:/app/src  # Hot reload for development
    environment:
      - ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=sqlite+aiosqlite:///./bandwidth_monitor.db
      - LOG_LEVEL=INFO
      - ENABLE_MONITORING=true
      - MONITORING_INTERVAL=30
      - NETWORK_INTERFACE=eth0
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
    # Grant network capabilities for packet capture and traffic control
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    # Run in privileged mode for full network access
    privileged: true
    networks:
      - bandwidth-monitor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # React Dashboard (Development with Vite)
  dashboard:
    image: node:20-alpine
    container_name: bandwidth-monitor-dashboard
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./dashboard-react:/app
      - /app/node_modules  # Prevent overwriting node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - DOCKER_ENV=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - bandwidth-monitor-network
    restart: unless-stopped

networks:
  bandwidth-monitor-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  db-data:
    driver: local
