version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: bandwidth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bandwidth_monitor}
      POSTGRES_USER: ${DB_USER:-bandwidth_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - bandwidth_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bandwidth_user} -d ${DB_NAME:-bandwidth_monitor}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bandwidth-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    networks:
      - bandwidth_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Bandwidth Monitor API
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: bandwidth-monitor:latest
    container_name: bandwidth-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Environment
      ENV: production
      
      # Database (PostgreSQL)
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-bandwidth_user}:${DB_PASSWORD:?Database password required}@postgres:5432/${DB_NAME:-bandwidth_monitor}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-300}
      
      # Security
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      
      # API
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_TITLE: ${API_TITLE:-Smart Bandwidth Monitor}
      API_VERSION: ${API_VERSION:-1.0.0}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      LOG_FILE: ${LOG_FILE:-logs/app.log}
      
      # Network Monitoring
      NETWORK_INTERFACE: ${NETWORK_INTERFACE:-eth0}
      ENABLE_MONITORING: ${ENABLE_MONITORING:-true}
      ENABLE_PACKET_CAPTURE: ${ENABLE_PACKET_CAPTURE:-true}
      CAPTURE_INTERVAL: ${CAPTURE_INTERVAL:-10}
      
      # Bandwidth Control
      MAX_BANDWIDTH_MBPS: ${MAX_BANDWIDTH_MBPS:-1000}
      ENABLE_BLOCKING: ${ENABLE_BLOCKING:-true}
      ENABLE_THROTTLING: ${ENABLE_THROTTLING:-true}
      DEFAULT_THROTTLE_RATE: ${DEFAULT_THROTTLE_RATE:-1}
      
      # Notifications
      SMTP_SERVER: ${SMTP_SERVER:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      
      # Alerts
      ALERT_CHECK_INTERVAL: ${ALERT_CHECK_INTERVAL:-60}
      CLEANUP_INTERVAL: ${CLEANUP_INTERVAL:-86400}
      
    volumes:
      - ./logs:/app/logs
      - api_data:/app/data
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - bandwidth_network
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Dashboard (Nginx)
  dashboard:
    image: nginx:alpine
    container_name: bandwidth-dashboard
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./nginx-dashboard.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${DASHBOARD_PORT:-3000}:80"
    networks:
      - bandwidth_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_data:
    driver: local

networks:
  bandwidth_network:
    driver: bridge
